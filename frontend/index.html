<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#00545F" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#00545F" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- iOS doesn't read the web manifest for "Add to Home Screen" — these three
         tags are what actually make it launch full-screen with no Safari chrome
         and use the teal status bar instead of iOS's default. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fee Ledger" />
    <title>Fee Ledger</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      /* Global reset: without this, the browser's default 8px body margin and white
         background peek out around the app's own background on every page, since
         the app only paints inside its own root div, not the raw <html>/<body>. */
      html, body { margin: 0; padding: 0; background: #ECFFB6; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
